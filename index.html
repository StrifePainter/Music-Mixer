<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Crossing Music Mixer</title>
    <link href="css/grid.css" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">
</head>
<body>

    <header class="grid-con center-grid-con">
        <h1 class="box col-span-full">Animal Crossing Music Mixer</h1>
    </header>

    <main>
        <section class="grid-con center-grid-con" id="screens">
            <!-- <div class="col-start-2 col-end-4 m-col-start-4 m-col-end-10" id="top-screen">
            </div>
            <div class="box col-start-2 col-end-4 m-col-start-4 m-col-end-10" id="bottom-screen"></div>

            
            drop zones nested divs
            <section class="grid-con center-grid-con" id="top-screen-nested">
                <div class="drop-zone box"></div>
            </section> -->

            <div class="m-col-start-4 m-col-end-10" id="top-screen">
            </div>
            <div class="m-col-start-5 m-col-end-9" id="drop-zone-con">
                <div class="col-span-1 drop-zone box top-screen-nested"></div>
                <div class="col-span-1 drop-zone box top-screen-nested"></div>
                <div class="col-span-1 drop-zone box top-screen-nested"></div>
                <div class="col-span-1 drop-zone box top-screen-nested"></div>
            </div>

            <div class="m-col-start-4 m-col-end-10" id="btm-screen"></div>
            <div class="m-col-start-5 m-col-end-9" id="drag-icons-con">
                <div class="col-span-1 drag-icon" draggable="true">
                    <img data-trackref="pluck" src="images/present.svg" alt="gift box" class="loop">
                </div>
                <div class="col-span-1 drag-icon" draggable="true">
                    <img data-trackref="" src="images/fossil.png" alt="fossil" class="loop">
                </div>
                <div class="col-span-1 drag-icon box"></div>
                <div class="col-span-1 drag-icon box"></div>
                <div class="col-span-1 drag-icon box"></div>
                <div class="col-span-1 drag-icon box"></div>
                <div class="col-span-1 drag-icon box"></div>
                <div class="col-span-1 drag-icon box"></div>
            </div>
        </section>

        <!-- drop zones nested divs
        <section class="grid-con center-grid-con" id="top-screen-nested">
            <div class="drop-zone box m-col-start-5 m-col-end-6"></div>
        </section> -->

            <!-- Audio Controls -->
        <section class="grid-con center-grid-con audio-controls">
            <button id="playButton">PLAY</button>
            <button id="pauseButton">PAUSE</button>
            <button id="rewindButton">REWIND</button>
            <input id="volumeControl"  type="range" min="1" max="100" range="100">
        </section>


        <!-- Rate Me Section -->
        <section class="grid-con">
        <div id="box-rating" class="col-span-full">
        <h2>Rate Me!</h2>
        <p>How did we do?</p>
        <span class="star-rating">
		<label for="rate-1" style="--i:1"><i class="fa-solid fa-star"></i></label>
		<input type="radio" name="rating" id="rate-1" value="1" checked>
		<label for="rate-2" style="--i:2"><i class="fa-solid fa-star"></i></label>
		<input type="radio" name="rating" id="rate-2" value="2">
		<label for="rate-3" style="--i:3"><i class="fa-solid fa-star"></i></label>
		<input type="radio" name="rating" id="rate-3" value="3">
		<label for="rate-4" style="--i:4"><i class="fa-solid fa-star"></i></label>
		<input type="radio" name="rating" id="rate-4" value="4">
		<label for="rate-5" style="--i:5"><i class="fa-solid fa-star"></i></label>
		<input type="radio" name="rating" id="rate-5" value="5">
	    </span>
        </div>
        </section>


    </main>

    <footer class="grid-con center-grid-con">
        <div class="box col-span-full">
            <p>Animal Crossing<span>&trade;</span> is intellectual property of Nintendo</p>
            <p><span>©</span> 2003, 2004 HAL Laboratory, Inc. Animal Crossing<span>&trade;</span></p>
            <p>*This site was created for a school project by two Animal Crossing<span>&trade;</span> fans and is not being used for profit in any way.</p>
        </div>
    </footer>
    
</body>
</html>
